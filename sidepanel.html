<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Bili Digest</title>
    <link rel="stylesheet" href="fonts/stack-sans/stack-sans.css" />
    <link rel="stylesheet" href="fonts/misans/MiSans-Regular.min.css" />
    <link rel="stylesheet" href="fonts/misans/MiSans-Medium.min.css" />
    <link rel="stylesheet" href="fonts/misans/MiSans-Bold.min.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand-row">
        <span class="brand-name">BILI DIGEST</span>
        <span class="brand-sub">哔哩精读</span>
        <button id="themeToggleBtn" class="theme-toggle" type="button" title="切换日间 / 夜间">☾</button>
      </div>
      <h1 id="videoTitle" class="video-title">尚未检测到视频</h1>
      <div id="videoMeta" class="video-meta"></div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="transcript" role="tab">字幕</button>
      <button class="tab" data-tab="overview" role="tab">概览</button>
      <button class="tab" data-tab="notes" role="tab">笔记</button>
      <button class="tab" data-tab="chat" role="tab">对话</button>
      <button class="tab" data-tab="settings" role="tab">设置</button>
    </nav>

    <main class="content">
      <section id="tab-transcript" class="panel active">
        <div class="panel-toolbar">
          <div class="toolbar-left">
            <select id="partSelect" class="part-select hidden" aria-label="选择分 P"></select>
            <div class="mode-switch" role="tablist" aria-label="字幕视图">
              <button class="mode active" data-mode="original" role="tab">原文</button>
              <button class="mode" data-mode="bilingual" role="tab">双语</button>
            </div>
            <button id="hideOriginalBtn" class="ghost-btn hidden">隐藏原文</button>
            <select id="trackSelect" class="track-select hidden" aria-label="选择字幕轨道"></select>
          </div>
          <div class="toolbar-actions">
            <button id="translateBtn" class="ghost-btn" title="翻译整个视频（结果会缓存）">翻译</button>
            <button id="copyTranscriptBtn" class="icon-btn" title="复制当前视图字幕" aria-label="复制字幕">⧉</button>
            <button id="exportBtn" class="icon-btn" title="导出资料（字幕、笔记，不含 AI 概览）" aria-label="导出资料">↓</button>
            <button id="exportWithOverviewBtn" class="icon-btn" title="导出含 AI 概览的资料（需先在概览页生成）" aria-label="导出含 AI 概览">⇩</button>
            <button id="refreshBtn" class="icon-btn" title="重新加载字幕" aria-label="重新加载字幕">↻</button>
          </div>
        </div>
        <div id="transcriptStatus" class="status-line"></div>
        <div id="translationTrack" class="progress-track hidden">
          <div id="translationFill" class="progress-fill"></div>
        </div>
        <div id="segments" class="segments"></div>
      </section>

      <section id="tab-overview" class="panel">
        <div class="panel-toolbar">
          <button id="generateOverviewBtn" class="primary-btn">生成 AI 概览</button>
          <div class="toolbar-actions">
            <button id="exportOverviewBtn" class="icon-btn" title="导出概览" aria-label="导出概览">↓</button>
            <button id="regenerateOverviewBtn" class="icon-btn" title="重新生成" aria-label="重新生成">↻</button>
          </div>
        </div>
        <div id="overviewStatus" class="status-line"></div>
        <div id="overviewContent" class="overview"></div>
      </section>

      <section id="tab-notes" class="panel">
        <div id="noteComposer" class="note-composer">
          <textarea id="noteText" rows="3" placeholder="记下此刻的想法，保存后会带上时间戳…"></textarea>
          <div class="note-composer-row">
            <span id="noteTimeChip" class="chip">--:--</span>
            <div class="note-composer-actions">
              <button id="polishNoteBtn" class="ghost-btn">AI 润色</button>
              <button id="saveNoteBtn" class="primary-btn">保存笔记</button>
            </div>
          </div>
        </div>
        <div class="notes-toolbar">
          <div class="mode-switch notes-scope">
            <button class="mode active" data-scope="current">本视频</button>
            <button class="mode" data-scope="all">全部视频</button>
          </div>
          <button id="exportNotesBtn" class="ghost-btn" type="button" title="导出当前视图的笔记">导出笔记</button>
        </div>
        <div id="notesStatus" class="status-line"></div>
        <div id="notesList" class="notes"></div>
      </section>

      <section id="tab-chat" class="panel">
        <div class="panel-toolbar">
          <span class="chat-title">视频问答</span>
          <div class="toolbar-actions">
            <button id="regenerateChatBtn" class="icon-btn" title="重新回答上一条" aria-label="重新回答">↻</button>
            <button id="exportChatBtn" class="ghost-btn">导出对话</button>
            <button id="clearChatBtn" class="ghost-btn">重置对话</button>
          </div>
        </div>
        <div id="chatStatus" class="status-line"></div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-composer">
          <textarea
            id="chatInput"
            rows="2"
            placeholder="基于这段视频的字幕，问我任何问题…"
            spellcheck="false"
          ></textarea>
          <div class="chat-composer-row">
            <button id="sendChatBtn" class="primary-btn">发送</button>
          </div>
        </div>
      </section>

      <section id="tab-settings" class="panel">
        <div class="settings-group">
          <h2 class="group-title">AI 接口（OpenAI 兼容）</h2>
          <label class="field-label" for="apiKeyInput">API Key</label>
          <div class="key-row">
            <input
              id="apiKeyInput"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="sk-…"
            />
            <button id="toggleKeyBtn" class="icon-btn" title="显示/隐藏" aria-label="显示或隐藏密钥">◉</button>
          </div>
          <label class="field-label" for="baseUrlInput">接口地址（Base URL）</label>
          <input
            id="baseUrlInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://…"
          />
          <label class="field-label" for="modelSelect">模型</label>
          <select id="modelSelect">
            <option value="__custom__">自定义…</option>
          </select>
          <input
            id="modelInput"
            type="text"
            class="hidden"
            autocomplete="off"
            spellcheck="false"
            placeholder="手动输入模型名称"
          />
          <label class="field-label" for="thinkingLevelSelect">思考等级</label>
          <select id="thinkingLevelSelect">
            <option value="off">关闭思考（快速，省 token）</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高（更强，更慢更贵）</option>
            <option value="default">跟随服务默认</option>
          </select>
          <p class="hint dim">
            DeepSeek 支持思考开关与强度；其他 OpenAI 兼容端点传 reasoning_effort；Anthropic 兼容端点暂不附加此参数。
          </p>
          <div class="button-row">
            <button id="listModelsBtn" class="ghost-btn" type="button">拉取模型</button>
            <button id="testKeyBtn" class="ghost-btn">测试连接</button>
          </div>
          <div id="modelListHint" class="hint hidden"></div>
          <div id="keyTestResult" class="hint"></div>
        </div>

        <div class="settings-group">
          <h2 class="group-title">翻译</h2>
          <label class="field-label" for="targetLanguageSelect">目标语言</label>
          <select id="targetLanguageSelect">
            <option value="English">English（英语）</option>
            <option value="日本語">日本語（日语）</option>
            <option value="한국어">한국어（韩语）</option>
            <option value="custom">自定义…</option>
          </select>
          <input
            id="customLanguageInput"
            class="hidden"
            placeholder="输入目标语言，如 Français"
            spellcheck="false"
          />
        </div>

        <div class="settings-group">
          <h2 class="group-title">使用前提</h2>
          <p class="hint dim">
            读取字幕依赖你在 bilibili.com 的登录状态。扩展不会读取或保存你的登录信息，只是由浏览器在请求时自动携带。
          </p>
        </div>

        <div class="button-row sticky">
          <button id="saveSettingsBtn" class="primary-btn">保存设置</button>
        </div>
      </section>
    </main>

    <div id="explainSheet" class="explain-sheet hidden">
      <div class="sheet-head">
        <span class="sheet-title">AI 解释</span>
        <button id="closeExplainBtn" class="icon-btn" title="关闭" aria-label="关闭解释">✕</button>
      </div>
      <div id="explainOriginal" class="sheet-original"></div>
      <div id="explainResult" class="sheet-result"></div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
